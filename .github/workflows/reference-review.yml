name: Review reference index updates
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh-health-index.py
      - run: git diff -- src/data/health-index.json > reference-index.diff
      - uses: actions/upload-artifact@v4
        with:
          name: reference-index-for-human-review
          path: |
            src/data/health-index.json
            reference-index.diff
